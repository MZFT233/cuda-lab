[project]
name = "cuda-lab"
version = "0.1.0"
description = "End-to-end CUDA toolchain lab: CMake + Ninja + nvcc + MSVC + CTest, plus a CUDA-enabled PyTorch env"
requires-python = ">=3.12"
dependencies = [
  # CPU-only wheel (官方 pip 轮子不带 CUDA)；OpenCL 可用，CUDA 模块不可用。
  # 想跑 cudaarithm/cudafilters 等 GPU 模块需要源码编译，见 README。
  "opencv-python>=5.0",
]

[project.optional-dependencies]
# torch 必须用 uv 的 --torch-backend 装（PyPI 上的 torch 在 Windows 是 CPU-only）：
#   uv pip install --torch-backend cu126 torch torchvision
torch = ["torch", "torchvision"]

[tool.uv]
# 常规依赖走清华 TUNA；torch 见上面注释
index-url = "https://pypi.tuna.tsinghua.edu.cn/simple"
